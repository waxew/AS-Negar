name: AS-Negar Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify AS-Negar identity
        run: |
          grep -q 'applicationId = "com.asteam.negar"' app/build.gradle.kts
          grep -q 'variables.put("appName", "AS-Negar")' app/build.gradle.kts
          grep -q 'com.asteam.negar.media_provider' app/build.gradle.kts

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileArm64-v8aNoMLDebugKotlin --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleArm64-v8aNoMLDebug --stacktrace --no-daemon
