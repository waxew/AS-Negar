name: AS-Negar Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply AS-Negar identity migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          for a,b in {
            'variables.put("appName", "ReFra")':'variables.put("appName", "AS-Negar")',
            'applicationId = "com.dot.gallery"':'applicationId = "com.asteam.negar"',
            'base.archivesName.set("ReFra-${versionName}-$versionCode$offlinePrefix")':'base.archivesName.set("AS-Negar-${versionName}-$versionCode$offlinePrefix")'
          }.items(): s=s.replace(a,b)
          p.write_text(s)
          p=Path('app/src/main/res/values/strings.xml')
          s=p.read_text().replace('<string name="app_name">ReFra</string>','<string name="app_name">AS-Negar</string>')
          p.write_text(s)
          PY

      - name: Verify AS-Negar identity
        run: |
          grep -q 'applicationId = "com.asteam.negar"' app/build.gradle.kts
          grep -q 'variables.put("appName", "AS-Negar")' app/build.gradle.kts
          grep -q '<string name="app_name">AS-Negar</string>' app/src/main/res/values/strings.xml

      - name: Assemble debug APK
        run: ./gradlew :app:assembleArm64-v8aNoMLDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AS-Negar-debug
          path: app/build/outputs/apk/**/*.apk
